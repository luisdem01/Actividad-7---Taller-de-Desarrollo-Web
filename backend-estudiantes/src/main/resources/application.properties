spring.application.name=backend-estudiantes
server.port=8080

# Base de datos H2 en memoria (se reinicia al apagar el servidor)
spring.datasource.url=jdbc:h2:mem:universidad
spring.datasource.username=sa
spring.datasource.password=

# Consola web de H2: http://localhost:8080/h2-console
spring.h2.console.enabled=true

# JPA crea la tabla a partir de la entidad Estudiante
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Ejecutar data.sql despues de crear las tablas
spring.jpa.defer-datasource-initialization=true
